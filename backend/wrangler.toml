name = "raco-hotels-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Optional: expose public URL config to runtime
[vars]
ENVIRONMENT = "development"
# Base URL for accessing public R2 objects (no trailing slash).
# Example (custom domain): https://assets.example.com
# Example (R2 public bucket): https://pub-xxxxxx.r2.dev
R2_PUBLIC_BASE_URL = ""
# NotificationAPI credentials
NOTIFICATIONAPI_CLIENT_ID = "g4jp8l41x1z0s04iws7wo34hlc"
NOTIFICATIONAPI_CLIENT_SECRET = "uj1j04fe2gh80m1xzzk1amp8r24wjnlfpp521ugqkjhz7y99mwjnugp5c3"

# Frontend URL for email links (local development)
FRONTEND_URL = "http://localhost:5173"

# Password reset token expiry in days
PASSWORD_RESET_TOKEN_EXPIRY_DAYS = "7"



[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "raco-bucket"

# Local Development D1 Database (default)
[[d1_databases]]
binding = "DB"
database_name = "raco-db-local"
database_id = "local-db-id"
migrations_dir = "drizzle/migrations"

# KV Namespace for local development
[[kv_namespaces]]
binding = "KV"
id = "local-kv"
preview_id = "local-kv-preview"

# Production environment
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "raco-db"
database_id = "bcc2fbc6-d9bc-48ed-b4e3-6e5e41bacc77"
migrations_dir = "drizzle/migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "9c0e2893078246b5a5efa308ed4060a9"
preview_id = "local-kv-preview"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "raco-bucket"

[dev]
port = 8787
local_protocol = "http"

[triggers]
crons = ["0 5 * * *"] # Runs every day at 5 AM UTC

